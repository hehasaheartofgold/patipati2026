<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <title>서연 · PP</title>
  <meta name="description" content="서연 — PP 배우미">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../style.css?v=0.1">
  <link rel="icon" href="../images/favicon.png" type="image/x-icon">
</head>

<body>
  <main>
    <div class="person-head">
      <p class="back"><a href="../index.html">←</a></p>
      <h1 class="person-name">서연</h1>
      <a class="person-insta" href="https://www.instagram.com/my__snowball/" target="_blank" rel="noopener">@my__snowball</a>
    </div>

    <!-- 3x3 정사각형 컨테이너 9개 (메인과 같은 가로 3분할). 내용은 배우미별로 채움 -->
    <div class="grid-3 person-grid">
      <!-- 폴더별 사진(personal/서연/<폴더>/). pp-photo와 동일 구조, 랜덤 표시 + 클릭 시 다음 항목.
           내용 있는 컨테이너를 좌상단부터 채우도록 앞으로 배치 -->
      <figure id="seoyeon-deotmaru" class="block-image"><img alt="덧마루" decoding="async"></figure>
      <figure id="seoyeon-memo" class="block-image"><img alt="메모" decoding="async"></figure>
      <figure id="seoyeon-pancake" class="block-image"><img alt="팬케이크" decoding="async"></figure>
    </div>
  </main>

  <footer>
    <div id="footer-inner">
      <small>PP · PaTI 한배곳 4학년 &nbsp;|&nbsp; <a href="../index.html">← 대문</a></small>
    </div>
  </footer>

  <script src="../js/main.js?v=0.1"></script>
</body>

</html>
