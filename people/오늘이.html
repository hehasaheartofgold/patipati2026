<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <title>오늘이 · PP</title>
  <meta name="description" content="오늘이 — PP 배우미">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../style.css?v=0.7">
  <link rel="icon" href="../images/favicon.png" type="image/x-icon">
</head>

<body>
  <main>
    <div class="person-head">
      <p class="back"><a href="../index.html#people">←</a></p>
      <h1 class="person-name">오늘이</h1>
      <a class="person-insta" href="https://www.instagram.com/hwing.ing/" target="_blank" rel="noopener">@hwing.ing</a>
    </div>

    <!-- 3x3 정사각형 컨테이너 9개 (메인과 같은 가로 3분할). 내용은 배우미별로 채움 -->
    <div class="grid-3 person-grid people-grid">
      <!-- 폴더별 사진(personal/오늘이/<폴더>/) 자리표시 — js/main.js expandPhotos()가 figure 하나를 폴더 안 사진 한 장당 한 칸씩으로 펼침 -->
      <figure id="oneuli-structural-kite" class="block-image"><img alt="구조적 연" decoding="async"></figure>
      <figure id="oneuli-drawing" class="block-image"><img alt="드로잉" decoding="async"></figure>
      <!-- 비오비오는 사진+영상 혼합 — 영상도 한 칸씩(자동재생·무음·반복) -->
      <figure id="oneuli-biobio" class="block-image"></figure>
      <figure id="oneuli-watercolor" class="block-image"><img alt="수채화" decoding="async"></figure>
      <figure id="oneuli-yeonham" class="block-image"><img alt="연함" decoding="async"></figure>
    </div>
  </main>

  <footer>
    <div id="footer-inner">
      <small>PP · PaTI 한배곳 4학년 &nbsp;|&nbsp; <a href="../index.html">← 대문</a></small>
    </div>
  </footer>

  <script src="../js/main.js?v=0.7"></script>
</body>

</html>
